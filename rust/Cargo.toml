[package]
name = "treekle-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Rust core for treekle's to_plain and from_plain."
license = "Apache-2.0"
repository = "https://github.com/rekursiv-ai/treekle"
publish = false

[lib]
name = "_rust"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.27.2", features = ["extension-module"] }
hashbrown = "0.15"
# Perf: rows json_dumps, lockstep: 1.10-1.14x on float-heavy rows (json.rs shortest_digits).
ryu = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
pyo3-build-config = "=0.27.2"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
opt-level = 3
