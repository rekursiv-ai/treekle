# DO NOT EDIT -- generated from package-validation.yml.tmpl and this
# package's sync config. Hand edits are overwritten; change
# the template, the generator, or the sync config instead.
name: Package validation

on:
  pull_request:
    branches: [main]
    paths:
      - "**"
  push:
    branches: [main]
    paths:
      - "**"

permissions:
  contents: read

concurrency:
  group: package-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, type-check, test, and build
    runs-on: ubuntu-latest
    # Bounded so a hung step fails in minutes, not at the 6h default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # Outranks the checkout's .python-version, which pins a newer one.
          python-version: "3.12"
      - name: Cache apt packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-8787f28218a2ad65
      - name: Install system packages
        run: |
          for attempt in 1 2 3; do
            timeout 120 sudo apt-get update && break
            echo "apt-get update stalled (attempt $attempt)" >&2
            sleep $((attempt * 10))
          done
          timeout 300 sudo apt-get install -y --no-install-recommends ripgrep fd-find
      - name: Validate package
        run: |
          # Lint/type/test checks come from this package's own .pre-commit-config.yaml.
          # Restating each tool here means a newly added hook silently goes unrun.
          # `uv sync` builds the Rust core in place. The hooks measure coverage of the
          # Python implementation, so they run with the core off; pytest then runs it on.
          uv sync --frozen --all-groups
          TREEKLE_PURE_PYTHON=1 uv run pre-commit run --all-files --hook-stage pre-commit
          TREEKLE_PURE_PYTHON=1 uv run pre-commit run --all-files --hook-stage pre-push
          uv run pytest -q -p no:cacheprovider
          rm -rf dist
          uv build --out-dir dist
          uv run --isolated --no-project --no-index --no-build --find-links dist --with treekle python -P -W error scripts/check_wheel.py native
          uv run --isolated --no-project --with "$(uv run scripts/build_pure_wheel.py dist)" python -P -W error scripts/check_wheel.py python
