name: Publish Python package

on:
  release:
    types: [published]
  workflow_dispatch:
  # Builds and checks every wheel on each pull request, so a platform's
  # failure shows before a release; only the publish job is skipped.
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  wheels:
    name: Wheels ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    # Bounded so a hung build fails in minutes, not at the 6h default.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {name: linux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: auto}
          # A native Arm runner, not cross-compilation, so its wheels can be run.
          - {name: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: auto}
          - {name: macos-x86_64, runner: macos-15-intel, target: x86_64}
          - {name: macos-arm64, runner: macos-latest, target: aarch64}
          - {name: windows-x64, runner: windows-latest, target: x64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: |
            3.12
            3.13
            3.14

      # Profile-guided: an instrumented wheel runs scripts/train_pgo.py, and the
      # wheels that ship are built from the profile it recorded. Each runner is
      # native to its target, so the instrumented wheel can run there.
      - name: Install llvm-profdata
        shell: bash
        run: rustup component add llvm-tools

      - name: Make the profile directory
        shell: bash
        # Made here, so the Linux build container writes into a directory this
        # user owns.
        run: mkdir -p "$GITHUB_WORKSPACE/pgo-profiles"

      - name: Build instrumented wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --out pgo-wheel --interpreter 3.12
        env:
          RUSTFLAGS: -Cprofile-generate=${{ github.workspace }}/pgo-profiles

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Record and merge the profile
        shell: bash
        run: |
          uv run --isolated --no-project --no-index --no-build --find-links pgo-wheel \
            --python 3.12 --with treekle \
            python -P scripts/train_pgo.py
          sysroot=$(rustc --print sysroot)
          host=$(rustc -vV | sed -n 's/^host: //p')
          "$sysroot/lib/rustlib/$host/bin/llvm-profdata" merge \
            -o "$GITHUB_WORKSPACE/pgo.profdata" "$GITHUB_WORKSPACE/pgo-profiles"

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --out dist --interpreter 3.12 3.13 3.14
        env:
          RUSTFLAGS: -Cprofile-use=${{ github.workspace }}/pgo.profdata

      # The installer picks each interpreter's wheel from dist, as pip would
      # from PyPI; a missing wheel fails instead of building from source.
      - name: Check each wheel
        shell: bash
        run: |
          for python in 3.12 3.13 3.14; do
            uv run --isolated --no-project --no-index --no-build --find-links dist \
              --python "$python" --with treekle \
              python -P -W error scripts/check_wheel.py native
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-${{ matrix.platform.name }}
          path: dist

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-sdist
          path: dist

  pure-wheel:
    name: Python-only fallback wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Build and check fallback wheel
        run: |
          wheel=$(uv run scripts/build_pure_wheel.py dist)
          uv run --isolated --no-project --with "$wheel" \
            python -P -W error scripts/check_wheel.py python
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-pure-wheel
          path: dist

  publish:
    name: Publish package to PyPI
    needs: [wheels, sdist, pure-wheel]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Bounded so a hung publish fails in minutes, not at the 6h default.
    timeout-minutes: 20
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      # Each build job already installed and ran what it uploads.
      - name: Check package metadata
        run: |
          ls dist
          uv run --isolated --no-project --with twine twine check --strict dist/*

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
